<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مُصمم مساحات العمل المنزلية</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🪑 مُصمم ومُخطط مساحات العمل المنزلية</h1>
    <p>حلّل مكتبك واحصل على تقرير هندسي فوري</p>
  </header>

  <main>
    <section class="camera-section">
      <video id="video" autoplay playsinline></video>
      <div class="controls">
        <button id="startBtn">🎥 تشغيل الكاميرا</button>
        <button id="captureBtn" disabled>📸 تحليل المساحة</button>
      </div>
      <canvas id="canvas" hidden></canvas>
    </section>

    <section class="report-section" id="report">
      <h2>📊 تقرير التحليل</h2>
      <div class="placeholder">لم يتم التحليل بعد...</div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
